<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PixelCheck turns three design frames into one responsive React + Tailwind codebase, then proves it — rendered, measured and scored at every width in Nebius Token Factory Sandboxes." />
    <title>PixelCheck — designed once, verified everywhere</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D0B" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem('pc-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
